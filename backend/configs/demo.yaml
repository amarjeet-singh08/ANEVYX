# DEMO MODE
# Small dataset / lightweight model / short inference.
name: "demo"
model:
  encoder: "simple_cnn"
  image_size: 128
  batch_size: 4
  epochs: 2
training:
  learning_rate: 0.001
  device: "cpu"
data:
  split_strategy: "patient"
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
evaluation:
  metrics: ["mse", "ssim"]
